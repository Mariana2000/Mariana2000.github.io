name: Update training chart

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/update_training_chart.py'
      - 'scripts/test_training_chart.py'
      - '.github/workflows/update-training-chart.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: update-training-chart
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check data handling
        run: python -B -m unittest discover -s scripts -p 'test_training_chart.py'
      - name: Refresh chart from the public log
        run: python -B scripts/update_training_chart.py
      - name: Save the successful update
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add assets/images/training-distance.svg
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh public training distance chart'
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      # GITHUB_TOKEN commits do not automatically trigger a Pages build.
      # Request one explicitly, including when retrying a failed publication.
      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
